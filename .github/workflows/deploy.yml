# À chaque push sur la branche source : construit le site et publie le résultat sur main,
# la branche servie par GitHub Pages (adresse : https://berdalbere.github.io)
name: Déploiement GitHub Pages

on:
  push:
    branches: [source]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build (pré-rendu inclus)
        run: npm run build

      - name: Publication sur main
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          publish_branch: main
          force_orphan: true
