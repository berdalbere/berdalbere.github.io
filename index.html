    <!-- Polices Space Grotesk + Inter : auto-hébergées (paquets @fontsource importés dans src/main.jsx) -->

    <!-- Applique le thème et la langue mémorisés avant le premier affichage (évite le flash) -->
    <script>
      try {
        var theme = localStorage.getItem('theme')
        if (theme === 'light') {
          document.documentElement.classList.remove('dark')
          document.documentElement.classList.add('light')
        }
        var lang = localStorage.getItem('lang')
        if (lang === 'en') document.documentElement.lang = 'en'
      } catch (e) {}
    </script>
